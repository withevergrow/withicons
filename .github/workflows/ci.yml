name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint icons, test packages
    runs-on: ubuntu-latest
    env:
      WITH_RENDER_THREADS: 2   # the render pool: fewer workers, each holds a copy of the rendered icons
    timeout-minutes: 120   # 1,000 icons x 34 styles: the full build alone is ~45-60 min on a hosted runner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 1,000 icons x 34 styles outgrew the runner (16 GB RAM, ~14 GB disk): runs were cancelled mid-build.
      # Free preinstalled toolchains, add swap, and log memory/disk every 20 s (printed at the end, even on failure).
      - name: Make room (disk, swap, resource log)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/withicons.swap && sudo chmod 600 /mnt/withicons.swap
          sudo mkswap /mnt/withicons.swap && sudo swapon /mnt/withicons.swap
          free -m; df -h / /mnt
          cat > "$RUNNER_TEMP/mon.sh" <<'SH'
          while true; do
            echo "$(date +%T) $(free -m | awk '/Mem/{printf "mem %s/%sMB ", $3, $2} /Swap/{printf "swap %sMB ", $3}') $(df -h / | awk 'NR==2{print "disk free " $4}')"
            sleep 20
          done
          SH
          nohup bash "$RUNNER_TEMP/mon.sh" > "$RUNNER_TEMP/resources.log" 2>&1 &

      - run: npm ci

      - name: Build every icon x style, packages and site
        run: node forge/build.mjs

      - name: Lint skeletons and render through every style
        run: node forge/tools/check.mjs

      - name: Hand-drawn overrides (forge/hand/**, forge/HAND.md)
        run: node forge/tools/hand.mjs check --all --quiet

      - name: Lint animation specs (forge/motion/*.json)
        if: hashFiles('forge/tools/check-motion.mjs') != ''
        run: node forge/tools/check-motion.mjs

      - name: Agent skill up to date (names, palettes, animated icons)
        run: node scripts/skill-sync.mjs --check

      - name: Package tests (all workspaces that define "test")
        run: npm test --workspaces --if-present

      - name: Search engine tests (packages/search)
        if: hashFiles('packages/search/package.json') != ''
        run: npm test --workspace packages/search

      - name: Pack every package (npm publish --dry-run)
        run: node scripts/publish.mjs --dry-run

      - name: Deploy plan (no AWS credentials, prints what would upload)
        run: node scripts/deploy.mjs --dry-run --skip-build

      - name: Generated files up to date?
        run: |
          if [ -n "$(git status --porcelain -- site packages ':!packages/*/dist')" ]; then
            echo "::warning::node forge/build.mjs changed committed files. Run the build locally and commit the result."
            git status --short -- site packages ':!packages/*/dist' | head -50
          fi

      - name: Resource log
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/resources.log" || true
  infra:
    name: Lint CloudFormation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cfn-lint
      - run: cfn-lint --regions us-east-1 -- infra/*.yaml
