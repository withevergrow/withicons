name: Release to npm

# Tag-driven, lockstep release of every public package under packages/* (core, react, vue, svelte, angular,
# solid, web, classes, static, search, mcp, motion, dynamic and the `withicons` CLI; scripts/publish.mjs fails if one is missing):
#   1. bump the version in the root package.json (forge/build.mjs stamps it into every package)
#   2. node forge/build.mjs, update CHANGELOG.md, commit, then:  git tag v0.2.0 && git push origin v0.2.0
#   3. this workflow builds, tests, verifies all packages are at 0.2.0 and publishes them in
#      dependency order with provenance, then creates the GitHub Release.
#
# Auth: npm Trusted Publishing (OIDC). Configure it once per package on npmjs.com ->
# package -> Settings -> Trusted publishing: GitHub Actions, org "withevergrow", repo "withicons",
# workflow "release.yml", environment "npm". Trusted Publishing can only be added to a package that
# already exists, so the very first publish is manual (docs/LAUNCH.md). NPM_TOKEN is an optional
# fallback secret for packages that are not yet configured - delete it once all are.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate only (npm publish --dry-run)
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm Trusted Publishing + provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WITH_RENDER_THREADS: 2   # the render pool: fewer workers, each holds a copy of the rendered icons
    timeout-minutes: 150   # build + tests (~60 min at 1,000 icons), then up to 40 min (publish.mjs --wait) for npm to process the large packages
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: npm >= 11.5.1 (required for Trusted Publishing)
        run: npm install -g npm@^11.5.1 && npm --version

      # 1,000 icons x 34 styles outgrew the runner (16 GB RAM, ~14 GB disk): runs were cancelled mid-build.
      # Free preinstalled toolchains, add swap, and log memory/disk every 20 s (printed at the end, even on failure).
      - name: Make room (disk, swap, resource log)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/withicons.swap && sudo chmod 600 /mnt/withicons.swap
          sudo mkswap /mnt/withicons.swap && sudo swapon /mnt/withicons.swap
          free -m; df -h / /mnt
          cat > "$RUNNER_TEMP/mon.sh" <<'SH'
          while true; do
            echo "$(date +%T) $(free -m | awk '/Mem/{printf "mem %s/%sMB ", $3, $2} /Swap/{printf "swap %sMB ", $3}') $(df -h / | awk 'NR==2{print "disk free " $4}')"
            sleep 20
          done
          SH
          nohup bash "$RUNNER_TEMP/mon.sh" > "$RUNNER_TEMP/resources.log" 2>&1 &

      - run: npm ci
      - run: node forge/build.mjs
      - run: node forge/tools/check.mjs
      - run: node forge/tools/check-motion.mjs
      - run: node forge/tools/hand.mjs check --all --quiet   # every hand-drawn override (forge/HAND.md)
      - run: node forge/tools/check-dynamic.mjs   # Live icons (@withicons/dynamic): every generator x every style
      - run: node forge/tools/check-loaders.mjs --quiet   # Loaders (@withicons/loaders): every loader x every style
      - run: node forge/tools/check-palettes.mjs --quiet
      - run: node scripts/skill-sync.mjs --check
      - run: npm test --workspaces --if-present   # every package, @withicons/dynamic included

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: node scripts/publish.mjs --dry-run

      # npm publishing is OPT-IN: set the repository variable NPM_PUBLISH=true after the first manual
      # publish + Trusted Publishing setup (docs/LAUNCH.md). Until then a tag only builds, tests and
      # creates the GitHub Release with the packed tarballs attached.
      - name: Publish
        if: (github.event_name == 'push' && vars.NPM_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # empty once Trusted Publishing is set up everywhere
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/publish.mjs --expect "${GITHUB_REF_NAME}"
          else
            node scripts/publish.mjs
          fi

      - name: Pack release assets
        if: github.ref_type == 'tag'
        run: |
          mkdir -p release-assets
          npm pack --workspaces --pack-destination release-assets >/dev/null
          ls -la release-assets

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          # GitHub's API sometimes answers 5xx: retry, and if a try created the release but the upload failed, upload again
          for i in 1 2 3 4 5; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" release-assets/*.tgz --clobber && exit 0
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $pre \
                --title "with icons $GITHUB_REF_NAME" release-assets/*.tgz && exit 0
            fi
            echo "GitHub Release attempt $i failed; retrying in $((i * 15)) s"; sleep $((i * 15))
          done
          exit 1

      - name: Resource log
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/resources.log" || true
