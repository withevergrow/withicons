name: Deploy withicons.com

# Builds the site and the MCP/search Lambda, uploads changed files to S3, updates the Lambda code
# and invalidates only changed paths. AWS access is a short-lived OIDC session for the role created
# by infra/site.yaml (output DeployRoleArn) - no AWS keys are stored in GitHub.
#
# Repository settings needed (Settings -> Environments -> production):
#   variable AWS_DEPLOY_ROLE_ARN = <DeployRoleArn output>
#   variable WITHICONS_STACK     = withicons-site   (optional)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'blog/**'
      - 'forge/**'
      - 'packages/**'
      - 'skills/**'
      - 'infra/lambda/**'
      - 'scripts/deploy.mjs'
      - 'scripts/skill-sync.mjs'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      full_invalidation:
        description: Invalidate /* instead of only changed paths
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # AWS_DEPLOY_ROLE_ARN lives on the production environment; a job-level if: can't read environment variables
    # (it is evaluated before the environment loads), so there is no guard here. See docs/LAUNCH.md §6.5.
    runs-on: ubuntu-latest
    env:
      WITH_RENDER_THREADS: 2   # the render pool: fewer workers, each holds a copy of the rendered icons
    timeout-minutes: 120   # build (~45-60 min at 1,000 icons) + upload of ~2.8 GB
    environment:
      name: production   # OIDC subject repo:withevergrow@274390516/withicons@1400616361:environment:production
      url: https://withicons.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 1,000 icons x 34 styles outgrew the runner (16 GB RAM, ~14 GB disk): runs were cancelled mid-build.
      # Free preinstalled toolchains, add swap, and log memory/disk every 20 s (printed at the end, even on failure).
      - name: Make room (disk, swap, resource log)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/withicons.swap && sudo chmod 600 /mnt/withicons.swap
          sudo mkswap /mnt/withicons.swap && sudo swapon /mnt/withicons.swap
          free -m; df -h / /mnt
          cat > "$RUNNER_TEMP/mon.sh" <<'SH'
          while true; do
            echo "$(date +%T) $(free -m | awk '/Mem/{printf "mem %s/%sMB ", $3, $2} /Swap/{printf "swap %sMB ", $3}') $(df -h / | awk 'NR==2{print "disk free " $4}')"
            sleep 20
          done
          SH
          nohup bash "$RUNNER_TEMP/mon.sh" > "$RUNNER_TEMP/resources.log" 2>&1 &

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: withicons-deploy-${{ github.run_id }}
          aws-region: us-east-1

      - name: Build, upload, update API, invalidate
        env:
          WITHICONS_STACK: ${{ vars.WITHICONS_STACK || 'withicons-site' }}
        run: node scripts/deploy.mjs ${{ inputs.full_invalidation && '--full-invalidation' || '' }}

      - name: Smoke test
        run: |
          set -e
          for u in / /icons.html /llms.txt /icons.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://withicons.com$u")
            echo "$code $u"; [ "$code" = 200 ]
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://withicons.com/api/search?q=home")
          echo "$code /api/search?q=home"

      - name: Resource log
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/resources.log" || true
