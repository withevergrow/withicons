  <style>
    .nf { min-height: calc(100vh - var(--header-h)); display: grid; place-items: center; text-align: center; padding: 40px var(--gutter) 80px; position: relative; overflow: hidden; }
    .nf .nf-num { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 2vw, 22px); margin: 0 0 10px; font: 800 clamp(6rem, 3rem + 16vw, 15rem)/.85 var(--font-display); letter-spacing: -.06em; }
    .nf-o { display: inline-grid; place-items: center; width: .82em; height: .82em; border-radius: .22em; background: var(--style-soft); color: var(--style); transition: background-color .6s, color .6s; }
    .nf-o svg { width: 62%; height: 62%; }
    .nf-o svg.pop { animation: nf-pop .6s var(--e-spring); }
    @keyframes nf-pop { from { transform: scale(.3) rotate(-40deg); opacity: 0; } }
    .nf h1 { margin: 0 0 12px; font: 800 var(--step-3)/1 var(--font-display); letter-spacing: -.04em; }
    .nf h1 .hand { color: var(--c-solid-text); font-size: 1.1em; display: inline-block; transform: rotate(-3deg); }
    .nf p:not(.nf-num) { margin: 0 auto 28px; max-width: 42ch; color: var(--ink-2); font-size: var(--step-1); }
    .nf-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  </style>
</head>
<body data-page="404">

  <script src="/js/site.js" defer></script>
  <script src="/data/meta.js" defer></script>
  <script src="/data/style-line.js" defer></script>
  <script src="/js/home-icons.js" defer></script>
  <script>
    addEventListener('DOMContentLoaded', function () {
      var WI = window.WI, el = document.querySelector('[data-nf]'); if (!WI || !el) return
      // a lost icon trying on every style (drawn from the home page's small icon pack; the full style files are big)
      var P = window.WITH_HOME || { svg: {}, roots: {} }
      var seq = [['search', 'line'], ['compass', 'engrave'], ['map-pin', 'pixel'], ['smile', 'kawaii'], ['cloud', 'glass'], ['heart', 'retro'],
        ['star', 'sticker'], ['rocket', 'solid'], ['gift', 'duo'], ['sparkles', 'gloss'], ['lightbulb', 'sketch'], ['globe', 'blueprint']].filter(function (f) {
        return (P.svg[f[1]] && P.svg[f[1]][f[0]] != null) || WI.has(f[0], f[1])
      }), i = 0
      if (!seq.length) seq = [['search', 'line']]
      function draw(n, st) {
        var inner = P.svg[st] && P.svg[st][n]
        var r = P.roots && P.roots[st]
        if (inner == null) return WI.svg(n, st, 24, { 'class': 'pop' })
        if (!r) return WI.svgFrom(inner, st, 24, { 'class': 'pop' })
        var a = ''; for (var k in r) a += ' ' + k + '="' + WI.esc(r[k]) + '"'
        return '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"' + a + ' class="pop" aria-hidden="true" focusable="false">' + inner + '</svg>'
      }
      function show() {
        var f = seq[i % seq.length]; i++
        var s = draw(f[0], f[1]); if (!s) return
        WI.ORDER.forEach(function (o) { el.classList.remove('s-' + o) }); el.classList.add('s-' + f[1]); el.innerHTML = s
      }
      show(); if (!WI.reduced) setInterval(function () { if (!document.hidden) show() }, 2200)
    })
  </script>
